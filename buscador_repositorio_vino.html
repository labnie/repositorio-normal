<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repositorio de Documentos Recepcionales — ENSEBCS</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --vino: #6b1a2a;
    --vino-oscuro: #4a0f1c;
    --vino-claro: #8c2a3e;
    --dorado: #c9a84c;
    --crema: #f7f2ee;
    --blanco: #ffffff;
    --texto: #1c1c1c;
    --texto-suave: #5a5a5a;
    --borde: #e0d8d0;
    --radio: 12px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--crema);
    color: var(--texto);
    min-height: 100vh;
  }

  /* ENCABEZADO */
  .header {
    background: var(--vino-oscuro);
    color: white;
    padding: 2.5rem 2rem 2rem;
    position: relative;
    overflow: hidden;
  }

  .header::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 240px; height: 240px;
    border-radius: 50%;
    background: rgba(201,168,76,0.10);
  }

  .header::after {
    content: '';
    position: absolute;
    bottom: -50px; left: 25%;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
  }

  .header-inner { max-width: 860px; margin: 0 auto; position: relative; z-index: 1; }

  .escuela-label {
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.10em;
    opacity: 0.75;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(18px, 4vw, 26px);
    font-weight: 500;
    line-height: 1.35;
    margin-bottom: 4px;
  }

  .header-lab {
    font-size: 12px;
    font-weight: 300;
    opacity: 0.75;
    margin-top: 6px;
    letter-spacing: 0.02em;
  }

  .linea-dorada {
    width: 48px;
    height: 2px;
    background: var(--dorado);
    margin: 14px 0;
    border-radius: 2px;
  }

  .header-sub {
    font-size: 13px;
    opacity: 0.7;
    font-weight: 300;
    margin-top: 4px;
  }

  /* CONTENIDO */
  .main { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem; }

  /* BÚSQUEDA */
  .search-box {
    background: var(--blanco);
    border-radius: var(--radio);
    border: 1px solid var(--borde);
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }

  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }

  .search-row input {
    flex: 1;
    padding: 11px 16px;
    border: 1.5px solid var(--borde);
    border-radius: 8px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    color: var(--texto);
    background: var(--crema);
    transition: border-color 0.2s;
    outline: none;
  }

  .search-row input:focus { border-color: var(--vino); background: white; }
  .search-row input::placeholder { color: #aaa; }

  .btn-buscar {
    padding: 11px 22px;
    background: var(--vino);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }

  .btn-buscar:hover { background: var(--vino-claro); }

  .filtros {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .filtros select {
    padding: 8px 12px;
    border: 1.5px solid var(--borde);
    border-radius: 8px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    color: var(--texto);
    background: var(--crema);
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
  }

  .filtros select:focus { border-color: var(--vino); }

  /* RESULTADOS */
  .results-header {
    font-size: 13px;
    color: var(--texto-suave);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .results-header span {
    display: inline-block;
    background: var(--vino);
    color: white;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 10px;
    border-radius: 99px;
  }

  /* TARJETA */
  .card {
    background: var(--blanco);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    padding: 1.25rem 1.5rem;
    margin-bottom: 12px;
    transition: box-shadow 0.2s, border-color 0.2s;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .card:hover { box-shadow: 0 4px 18px rgba(0,0,0,0.07); border-color: #c8c2b8; }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }

  .card-titulo {
    font-size: 15px;
    font-weight: 500;
    color: var(--texto);
    line-height: 1.45;
    font-family: 'Playfair Display', serif;
  }

  .badge {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 11px;
    border-radius: 99px;
    white-space: nowrap;
    flex-shrink: 0;
    letter-spacing: 0.02em;
  }

  .badge-tesis { background: #f5e0e4; color: #6b1a2a; }
  .badge-informe { background: #ddf3e4; color: #1a5c32; }
  .badge-portafolio { background: #fff0d4; color: #7a4d00; }
  .badge-otro { background: #f0ede7; color: #5a5248; }

  .card-meta {
    font-size: 12.5px;
    color: var(--texto-suave);
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    align-items: center;
  }

  .card-meta-item { display: flex; align-items: center; gap: 4px; }

  .dot {
    width: 3px; height: 3px;
    background: var(--dorado);
    border-radius: 50%;
    display: inline-block;
  }

  .card-plan {
    font-size: 12px;
    color: #888;
    margin-top: 5px;
  }

  .btn-ver {
    display: inline-block;
    margin-top: 12px;
    padding: 6px 16px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    color: var(--vino);
    border: 1.5px solid var(--vino);
    border-radius: 8px;
    text-decoration: none;
    transition: background 0.2s, color 0.2s;
  }

  .btn-ver:hover { background: var(--vino); color: white; }

  /* ESTADOS */
  .estado {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--texto-suave);
  }

  .estado-icono { font-size: 36px; margin-bottom: 12px; }
  .estado p { font-size: 14px; line-height: 1.6; }
  .estado-error { color: #6b1a2a; }

  /* PIE */
  .footer {
    text-align: center;
    padding: 2rem 1rem;
    font-size: 12px;
    color: #aaa;
    border-top: 1px solid var(--borde);
    margin-top: 2rem;
  }

  @media (max-width: 540px) {
    .search-row { flex-direction: column; }
    .btn-buscar { width: 100%; }
    .card-top { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="escuela-label">Baja California Sur</div>
    <h1>Escuela Normal Superior del Estado<br>"Profr. Enrique Estrada Lucero"</h1>
    <div class="header-lab">Laboratorio Normalista de Investigación Educativa</div>
    <div class="linea-dorada"></div>
    <p class="header-sub">Repositorio de Documentos Recepcionales</p>
  </div>
</div>

<div class="main">

  <div class="search-box">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Buscar por título, autor o escuela de práctica..." />
      <button class="btn-buscar" onclick="buscar()">Buscar</button>
    </div>
    <div class="filtros">
      <select id="filtroTipo" onchange="buscar()">
        <option value="">Todos los tipos</option>
      </select>
      <select id="filtroPrograma" onchange="buscar()">
        <option value="">Todos los programas</option>
      </select>
      <select id="filtroAnio" onchange="buscar()">
        <option value="">Todos los años</option>
      </select>
      <select id="filtroEscuela" onchange="buscar()">
        <option value="">Todas las escuelas</option>
      </select>
    </div>
  </div>

  <div class="results-header" id="resultsHeader"></div>
  <div id="resultsList">
    <div class="estado">
      <div class="estado-icono">📄</div>
      <p>Cargando documentos...</p>
    </div>
  </div>

  <div class="footer">
    Repositorio académico · ENSEBCS · Actualizado automáticamente desde Google Sheets
  </div>

</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQN3VnXH148TripGiwhOyJdRbMmIKBkIOrupfPuvtFI9peLtS8kj4Z-L7tOXVJ9aA/pub?output=csv";

let allDocs = [];

function parseCSV(text) {
  const lines = text.split("\n");
  const headers = lines[0].split(",").map(h => h.trim().replace(/^"|"$/g, "").trim());
  return lines.slice(1).filter(l => l.trim()).map(line => {
    const values = [];
    let cur = "", inQ = false;
    for (let c of line) {
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { values.push(cur.trim()); cur = ""; }
      else cur += c;
    }
    values.push(cur.trim());
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (values[i] || "").replace(/^"|"$/g, "").trim(); });
    return obj;
  });
}

function badgeClass(tipo) {
  const t = (tipo || "").toLowerCase();
  if (t.includes("tesis")) return "badge badge-tesis";
  if (t.includes("informe")) return "badge badge-informe";
  if (t.includes("portafolio")) return "badge badge-portafolio";
  return "badge badge-otro";
}

function agregarOpcion(selectId, valor) {
  const sel = document.getElementById(selectId);
  if ([...sel.options].some(o => o.value === valor)) return;
  const o = document.createElement("option");
  o.value = valor; o.textContent = valor;
  sel.appendChild(o);
}

function poblarFiltros(docs) {
  const tipos = [...new Set(docs.map(d => d["Tipo de documento"]).filter(Boolean))].sort();
  const programas = [...new Set(docs.map(d => d["Programa de estudio"]).filter(Boolean))].sort();
  const anios = [...new Set(docs.map(d => d["Año"]).filter(Boolean))].sort().reverse();
  const escuelas = [...new Set(docs.map(d => d["Escuela de práctica"]).filter(Boolean))].sort();
  tipos.forEach(t => agregarOpcion("filtroTipo", t));
  programas.forEach(p => agregarOpcion("filtroPrograma", p));
  anios.forEach(a => agregarOpcion("filtroAnio", a));
  escuelas.forEach(e => agregarOpcion("filtroEscuela", e));
}

function buscar() {
  const q = document.getElementById("searchInput").value.toLowerCase();
  const tipo = document.getElementById("filtroTipo").value;
  const prog = document.getElementById("filtroPrograma").value;
  const anio = document.getElementById("filtroAnio").value;
  const escuela = document.getElementById("filtroEscuela").value;

  const resultados = allDocs.filter(d => {
    const texto = [d["Título"], d["Autor"], d["Escuela de práctica"], d["Plan de estudio"]].join(" ").toLowerCase();
    return (!q || texto.includes(q)) &&
           (!tipo || d["Tipo de documento"] === tipo) &&
           (!prog || d["Programa de estudio"] === prog) &&
           (!anio || d["Año"] === anio) &&
           (!escuela || d["Escuela de práctica"] === escuela);
  });

  const header = document.getElementById("resultsHeader");
  const list = document.getElementById("resultsList");

  if (resultados.length === 0) {
    header.innerHTML = "";
    list.innerHTML = `<div class="estado"><div class="estado-icono">🔍</div><p>No se encontraron documentos con esos criterios.<br>Intenta con otras palabras o quita los filtros.</p></div>`;
    return;
  }

  header.innerHTML = `Mostrando <span>${resultados.length} documento${resultados.length !== 1 ? "s" : ""}</span>`;

  list.innerHTML = resultados.map(d => `
    <div class="card">
      <div class="card-top">
        <div class="card-titulo">${d["Título"] || "Sin título"}</div>
        <span class="${badgeClass(d["Tipo de documento"])}">${d["Tipo de documento"] || "Documento"}</span>
      </div>
      <div class="card-meta">
        ${d["Autor"] ? `<span class="card-meta-item"><span class="dot"></span>${d["Autor"]}</span>` : ""}
        ${d["Año"] ? `<span class="card-meta-item"><span class="dot"></span>${d["Año"]}</span>` : ""}
        ${d["Programa de estudio"] ? `<span class="card-meta-item"><span class="dot"></span>${d["Programa de estudio"]}</span>` : ""}
        ${d["Escuela de práctica"] ? `<span class="card-meta-item"><span class="dot"></span>${d["Escuela de práctica"]}</span>` : ""}
      </div>
      ${d["Plan de estudio"] ? `<div class="card-plan">Plan de estudio: ${d["Plan de estudio"]}</div>` : ""}
      ${d["Liga"] ? `<a class="btn-ver" href="${d["Liga"]}" target="_blank">Ver documento</a>` : ""}
    </div>
  `).join("");
}

fetch(CSV_URL)
  .then(r => { if (!r.ok) throw new Error("Error de red"); return r.text(); })
  .then(text => {
    allDocs = parseCSV(text).filter(d => d["Título"]);
    if (allDocs.length === 0) {
      document.getElementById("resultsList").innerHTML = `<div class="estado estado-error"><div class="estado-icono">⚠️</div><p>La hoja está vacía o los encabezados no coinciden.<br>Verifica que la primera fila tenga los nombres de las columnas correctos.</p></div>`;
      return;
    }
    poblarFiltros(allDocs);
    buscar();
  })
  .catch(() => {
    document.getElementById("resultsList").innerHTML = `<div class="estado estado-error"><div class="estado-icono">⚠️</div><p>No se pudo conectar con la hoja de Google Sheets.<br>Verifica que esté publicada en formato CSV.</p></div>`;
  });

document.getElementById("searchInput").addEventListener("keyup", e => {
  if (e.key === "Enter") buscar();
});
</script>
</body>
</html>
